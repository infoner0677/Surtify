<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b7a5a">
<title>Surtify · Caja</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6f8;--card:#fff;--tx:#18202a;--mu:#667085;--pr:#0b7a5a;--on:#fff;--bd:#e2e6ea;--er:#b42318;--ok:#067647;--wa:#b54708}
@media(prefers-color-scheme:dark){:root{--bg:#10151b;--card:#19202a;--tx:#edf0f3;--mu:#98a2b3;--pr:#2fb386;--on:#06241a;--bd:#2a323d;--er:#f97066;--ok:#47cd89;--wa:#fdb022}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:1.15rem;margin:0}h2{font-size:1.05rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.mu{color:var(--mu);font-size:.86rem}.er{color:var(--er)}.ok{color:var(--ok)}.wa{color:var(--wa)}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 8px}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--pr);color:var(--on);font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.s{padding:6px 12px}button:disabled{opacity:.5}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd);white-space:nowrap}
.tabs button.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.stats b{display:block;font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:260px;overflow:auto}
.p{background:var(--bg);color:var(--tx);border:1px solid var(--bd);text-align:left;font-weight:500}.p small{display:block;color:var(--mu);font-weight:400}
.line{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}.line:last-child{border:0}
.tot{font-size:1.4rem;font-weight:700}
.t{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}
#toast{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0));background:var(--tx);color:var(--bg);padding:12px;border-radius:10px;display:none;z-index:9}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:8}.modal .card{max-width:420px;width:100%;margin:0}
</style></head>
<body><div class="w" id="app"></div><div id="toast"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const cop=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db,perfil,caja,prods=[],cart=new Map(),tab='vender',q='',busy=false;

function toast(m,bad){const t=$('#toast');t.textContent=m;t.style.background=bad?'var(--er)':'var(--tx)';t.style.color=bad?'#fff':'var(--bg)';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',4500)}
async function call(fn,args){ // llama una función RPC y muestra el error legible del servidor
  const {data,error}=await db.rpc(fn,args||{});
  if(error){toast(error.message,true);return {error}}
  return {data};
}

async function init(){
  const c=window.SURTIFY||{};
  if(!c.SUPABASE_URL||c.SUPABASE_URL.includes('TU-PROYECTO')){
    app.innerHTML='<div class="card"><h2>Falta configurar Supabase</h2><p>Edita <b>config.js</b> y pega la URL y la clave anon de tu proyecto.</p></div>';return}
  db=supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);
  const {data:{session}}=await db.auth.getSession();
  session?boot():login();
}

function login(){
  app.innerHTML=`<div class="card" style="margin-top:12vh"><h1>Surtify</h1><p class="mu">Caja registradora simple</p>
  <label>Correo<input id="em" type="email" autocomplete="username"></label>
  <label>Contraseña<input id="pw" type="password" autocomplete="current-password"></label>
  <button id="go" style="width:100%">Entrar</button></div>`;
  const go=async()=>{
    const {error}=await db.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
    error?toast('Correo o contraseña incorrectos',true):boot()};
  $('#go').onclick=go;$('#pw').onkeydown=e=>e.key==='Enter'&&go();
}

async function boot(){
  const p=await call('perfil_actual');
  if(!p.data){app.innerHTML='<div class="card"><h2>Usuario sin empleado</h2><p>Tu cuenta no está vinculada a un empleado activo.</p><button class="g" id="lo">Salir</button></div>';$('#lo').onclick=logout;return}
  perfil=p.data;await refresh();
}
async function logout(){await db.auth.signOut();cart.clear();login()}
async function refresh(){
  caja=(await call('resumen_caja')).data;
  if(caja){const {data,error}=await db.from('v_productos_pos').select('*').order('nombre');if(error)toast(error.message,true);prods=data||[]}
  render();
}

function render(){
  const adm=perfil.es_administrador;
  const head=`<div class="row" style="margin:4px 0 12px"><div><h1>${esc(perfil.nombre_comercial)}</h1>
    <span class="mu">${esc(perfil.nombre_sucursal)} · ${esc(perfil.nombre)} · ${adm?'Modo completo':'Caja simple'}</span></div><span class="sp"></span><button class="g s" id="lo">Salir</button></div>`;
  if(!caja){
    app.innerHTML=head+`<div class="card"><h2>Abrir caja</h2><p class="mu">Indica el efectivo con el que inicias el turno (la base para dar cambio).</p>
      <input id="base" type="number" inputmode="decimal" min="0" placeholder="Ej: 50000"><button id="ab" style="width:100%">Abrir caja</button></div>`;
    $('#lo').onclick=logout;
    $('#ab').onclick=async()=>{const r=await call('abrir_caja',{p_monto_apertura:Number($('#base').value)});if(r.data){toast('Caja abierta');refresh()}};
    return}
  const tabs=[['vender','Vender'],['gasto','Gasto'],['cerrar','Cerrar caja']].concat(adm?[['inv','Inventario']]:[]);
  app.innerHTML=head+`<div class="stats">
    <div><span class="mu">Efectivo esperado</span><b>${cop(caja.monto_cierre_esperado)}</b></div>
    <div><span class="mu">Ventas (${caja.num_ventas})</span><b>${cop(caja.total_ventas)}</b></div>
    <div><span class="mu">Gastos</span><b>${cop(caja.total_gastos)}</b></div></div>
    <div class="tabs" style="margin-top:12px">${tabs.map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div><div id="body"></div>`;
  $('#lo').onclick=logout;
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  ({vender:vVender,gasto:vGasto,cerrar:vCerrar,inv:vInv})[tab]();
}

/* ---------- Vender ---------- */
function vVender(){
  $('#body').innerHTML=`<div class="card"><input id="q" placeholder="Buscar o escanear código de barras" value="${esc(q)}" autocomplete="off"><div class="grid" id="pl"></div></div>
  <div class="card"><h2>Carrito</h2><div id="cl"></div></div>`;
  const input=$('#q');
  input.oninput=()=>{q=input.value;list()};
  input.onkeydown=e=>{if(e.key!=='Enter')return;const t=q.trim().toLowerCase();
    const hit=prods.find(p=>p.codigo_barras===q.trim())||(filtered().length===1&&filtered()[0]);
    if(hit){add(hit);q='';input.value='';list()}};
  list();cartView();
}
const filtered=()=>{const t=q.trim().toLowerCase();return prods.filter(p=>!t||p.nombre.toLowerCase().includes(t)||(p.codigo_barras||'').includes(t))};
function list(){
  $('#pl').innerHTML=filtered().slice(0,40).map(p=>`<button class="p" data-id="${p.id_producto}" ${p.stock<=0?'disabled':''}>${esc(p.nombre)}<small>${cop(p.precio_venta)} · stock ${p.stock}</small></button>`).join('')||'<span class="mu">Sin resultados</span>';
  $('#pl').querySelectorAll('.p').forEach(b=>b.onclick=()=>add(prods.find(p=>p.id_producto==b.dataset.id)));
}
function add(p){const x=cart.get(p.id_producto)||{p,qty:0};if(x.qty>=p.stock){toast('No hay más stock de '+p.nombre,true);return}x.qty++;cart.set(p.id_producto,x);cartView()}
const total=()=>[...cart.values()].reduce((s,x)=>s+x.qty*x.p.precio_venta,0);
function cartView(){
  const el=$('#cl');if(!el)return;
  if(!cart.size){el.innerHTML='<span class="mu">Toca un producto para agregarlo.</span>';return}
  el.innerHTML=[...cart.values()].map(x=>`<div class="line"><div class="sp">${esc(x.p.nombre)}<div class="mu">${cop(x.p.precio_venta)}</div></div>
    <button class="g s" data-m="${x.p.id_producto}">−</button><b>${x.qty}</b><button class="g s" data-a="${x.p.id_producto}">+</button><b style="min-width:80px;text-align:right">${cop(x.qty*x.p.precio_venta)}</b></div>`).join('')+
  `<div class="row" style="margin-top:10px"><span class="sp mu">Total</span><span class="tot">${cop(total())}</span></div>
   <select id="mp"><option>Efectivo</option><option>Nequi</option><option>Daviplata</option><option>Bre-B</option><option>Tarjeta</option></select>
   <div id="efe"><input id="rec" type="number" inputmode="decimal" placeholder="Efectivo recibido"><div id="cam" class="mu"></div></div>
   <div class="row"><button class="g" id="vac">Vaciar</button><button class="sp" id="cob">Cobrar</button></div>`;
  el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const x=cart.get(+b.dataset.m);x.qty--;if(x.qty<=0)cart.delete(+b.dataset.m);cartView()});
  el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>add(cart.get(+b.dataset.a).p));
  const sync=()=>{$('#efe').style.display=$('#mp').value==='Efectivo'?'block':'none';const r=Number($('#rec').value);
    $('#cam').innerHTML=r?(r>=total()?'Cambio: <b class="ok">'+cop(r-total())+'</b>':'<span class="er">Falta '+cop(total()-r)+'</span>'):''};
  $('#mp').onchange=sync;$('#rec').oninput=sync;sync();
  $('#vac').onclick=()=>{cart.clear();cartView()};
  $('#cob').onclick=async e=>{if(busy)return;busy=true;e.target.disabled=true;
    const ef=$('#mp').value==='Efectivo';
    const r=await call('registrar_venta',{p_items:[...cart.values()].map(x=>({id_producto:x.p.id_producto,cantidad:x.qty})),
      p_metodo_pago:$('#mp').value,p_monto_recibido:ef&&$('#rec').value?Number($('#rec').value):null});
    busy=false;e.target.disabled=false;
    if(r.data){cart.clear();q='';await refresh();recibo(r.data)}};
}
function recibo(v){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="card"><h2 class="ok">Venta registrada</h2><div class="mu">Factura ${esc(v.numero_factura)}</div>
   <div class="line"><span class="sp">Subtotal</span>${cop(v.subtotal)}</div><div class="line"><span class="sp">IVA incluido</span>${cop(v.impuestos)}</div>
   <div class="line"><span class="sp"><b>Total</b></span><b>${cop(v.total)}</b></div>
   ${v.metodo_pago==='Efectivo'?`<div class="line"><span class="sp">Recibido</span>${cop(v.monto_recibido)}</div><div class="line"><span class="sp"><b>Cambio</b></span><b class="ok">${cop(v.cambio)}</b></div>`:`<div class="line"><span class="sp">Pago</span>${esc(v.metodo_pago)}</div>`}
   <button style="width:100%;margin-top:10px">Nueva venta</button></div>`;
  m.querySelector('button').onclick=()=>m.remove();document.body.appendChild(m);
}

/* ---------- Gasto ---------- */
function vGasto(){
  $('#body').innerHTML=`<div class="card"><h2>Gasto de caja</h2><p class="mu">Dinero que sale del cajón (almuerzo, servicios, imprevistos). Se resta del efectivo esperado.</p>
  <input id="gm" type="number" inputmode="decimal" placeholder="Monto"><input id="gc" placeholder="Concepto (ej: Bolsas de empaque)"><input id="gd" placeholder="Detalle (opcional)">
  <button id="gs" style="width:100%">Registrar gasto</button></div>`;
  $('#gs').onclick=async()=>{const r=await call('registrar_gasto',{p_monto:Number($('#gm').value),p_concepto:$('#gc').value,p_descripcion:$('#gd').value||null});
    if(r.data){toast('Gasto registrado');refresh()}};
}

/* ---------- Cerrar caja ---------- */
function vCerrar(){
  const mv=Object.entries(caja.ventas_por_metodo||{}).map(([k,v])=>`<div class="line"><span class="sp">${esc(k)}</span>${cop(v)}</div>`).join('')||'<span class="mu">Sin ventas</span>';
  $('#body').innerHTML=`<div class="card"><h2>Arqueo</h2>
   <div class="line"><span class="sp">Base de apertura</span>${cop(caja.monto_apertura)}</div>
   <div class="line"><span class="sp">Devoluciones</span>${cop(caja.total_devoluciones)}</div>
   <div class="line"><span class="sp"><b>Efectivo esperado en el cajón</b></span><b>${cop(caja.monto_cierre_esperado)}</b></div>
   <h2 style="margin-top:14px">Ventas por método</h2>${mv}
   <h2 style="margin-top:14px">Efectivo contado</h2><input id="real" type="number" inputmode="decimal" placeholder="Cuenta el efectivo y escríbelo aquí">
   <button id="cc" style="width:100%">Cerrar caja</button></div>`;
  $('#cc').onclick=async()=>{if(!confirm('¿Cerrar la caja? Ya no podrás vender en este turno.'))return;
    const r=await call('cerrar_caja',{p_monto_real:Number($('#real').value)});
    if(r.data){const d=r.data.diferencia;cart.clear();tab='vender';caja=null;render();
      app.insertAdjacentHTML('beforeend',`<div class="card"><h2>Caja cerrada</h2><p>Esperado ${cop(r.data.monto_cierre_esperado)} · Contado ${cop(r.data.monto_cierre_real)}</p>
      <p class="${d===0?'ok':d<0?'er':'wa'}"><b>${d===0?'Cuadra al centavo':d<0?'Faltante de '+cop(-d):'Sobrante de '+cop(d)}</b></p></div>`)}};
}

/* ---------- Inventario (solo administrador) ---------- */
async function vInv(){
  $('#body').innerHTML='<div class="card t"><h2>Inventario por sucursal</h2><div id="it">Cargando…</div></div>';
  const {data,error}=await db.from('v_reporte_critico_inventario').select('*').order('stock');
  if(error)return toast(error.message,true);
  $('#it').innerHTML='<table><tr><th>Sucursal</th><th>Producto</th><th>Stock</th><th>Mín.</th><th></th></tr>'+data.map(r=>`<tr><td>${esc(r.sucursal)}</td><td>${esc(r.producto)}</td><td>${r.stock}</td><td>${r.stock_minimo}</td><td class="${r.stock<=r.stock_minimo?'er':'ok'}">${r.stock<=r.stock_minimo?'Reponer':'OK'}</td></tr>`).join('')+'</table>';
}
init();
</script></body></html>
