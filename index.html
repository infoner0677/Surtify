<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b7a5a">
<title>Surtify · Caja</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{color-scheme:light dark;--bg:#f4f6f8;--card:#fff;--tx:#18202a;--mu:#667085;--pr:#0b7a5a;--on:#fff;--bd:#e2e6ea;--er:#b42318;--ok:#067647;--wa:#b54708;--wab:#fffaeb}
@media(prefers-color-scheme:dark){:root{--bg:#10151b;--card:#19202a;--tx:#edf0f3;--mu:#98a2b3;--pr:#2fb386;--on:#06241a;--bd:#2a323d;--er:#f97066;--ok:#47cd89;--wa:#fdb022;--wab:#2a2110}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:980px;margin:0 auto;padding:12px}
h1{font-size:1.15rem;margin:0}h2{font-size:1.05rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.mu{color:var(--mu);font-size:.86rem}.er{color:var(--er)}.ok{color:var(--ok)}.wa{color:var(--wa)}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 8px}
input[type=checkbox]{width:auto;margin:0 6px 0 0}
label{display:block;font-size:.9rem}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--pr);color:var(--on);font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.s{padding:6px 12px}button:disabled{opacity:.5}
[hidden]{display:none!important}
.off{position:sticky;top:0;z-index:5;background:var(--wab);color:var(--wa);border-bottom:1px solid var(--bd);padding:8px 12px;text-align:center;font-size:.9rem}
.hd{display:flex;align-items:center;gap:8px;margin:2px 0 4px}.logo{height:38px;width:auto;display:block}.who{margin:0 0 12px}
.login{max-width:420px;margin:9vh auto 0}.logo-l{display:block;width:min(260px,70%);height:auto;margin:6px auto 4px}
.tabs{display:flex;gap:6px;margin:12px 0;overflow-x:auto}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd);white-space:nowrap}
.tabs button.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--er);color:#fff;font-size:.75rem;line-height:20px;text-align:center;margin-left:4px}
.stats,.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}
.stats div,.kpis div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.stats b,.kpis b{display:block;font-size:1.05rem}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}.two .card{margin:0}.two{margin-bottom:12px}
.sucs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:12px}.sucs .card{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:260px;overflow:auto}
.p{background:var(--bg);color:var(--tx);border:1px solid var(--bd);text-align:left;font-weight:500}.p small{display:block;color:var(--mu);font-weight:400}
.line{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}.line:last-child{border:0}
.tot{font-size:1.4rem;font-weight:700}
.alert{background:var(--wab);border-color:var(--wa)}
.t{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}th{color:var(--mu);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:4px}.col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:150px}
.col i{display:block;width:100%;background:var(--pr);border-radius:4px 4px 0 0;min-height:2px}.col small{font-size:.65rem;color:var(--mu);height:14px;white-space:nowrap}
.meter{height:8px;border-radius:4px;background:var(--bd);margin:3px 0 8px;overflow:hidden}.meter i{display:block;height:100%;background:var(--pr)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{padding:6px 12px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0));background:var(--tx);color:var(--bg);padding:12px;border-radius:10px;display:none;z-index:99}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.modal .card{max-width:440px;width:100%;margin:0;max-height:92vh;overflow:auto}
</style></head>
<body><div class="w" id="app"></div><div id="toast"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const cop=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hora=x=>x?new Date(x).toLocaleString('es-CO',{timeZone:'America/Bogota',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const pl=(n,w)=>`${n||0} ${w}${Number(n)===1?'':'s'}`;
const ddmm=f=>String(f).slice(8,10)+'/'+String(f).slice(5,7);
let db,perfil,caja,adm=false,prods=[],cart=new Map(),tab='vender',q='',busy=false;
let facSin=false,autoSub='verificar',autoCnt=0;
let cartera=[],carteraOk=false,metodoSel='Efectivo',cliSel='',fiQ='';
let dias=7,invData=[],cats=[],sucs=[],invAlertas=0,invQ='',invSuc='',invSolo=false;

function toast(m,bad){const t=$('#toast');t.textContent=m;t.style.background=bad?'var(--er)':'var(--tx)';t.style.color=bad?'#fff':'var(--bg)';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>{t.style.display='none'},4500)}
async function call(fn,args){ // llama una función RPC y muestra el error legible del servidor
  const {data,error}=await db.rpc(fn,args||{});
  if(error){toast(error.message,true);return {error}}
  return {data};
}
function modal(html){
  const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="card">'+html+'</div>';
  m.addEventListener('mousedown',e=>{if(e.target===m)m.remove()});document.body.appendChild(m);return m;
}

async function init(){
  const c=window.SURTIFY||{};
  if(!c.SUPABASE_URL||c.SUPABASE_URL.includes('TU-PROYECTO')){
    app.innerHTML='<div class="card"><h2>Falta configurar Supabase</h2><p>Edita <b>config.js</b> y pega la URL y la clave anon de tu proyecto.</p></div>';return}
  db=supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);
  const {data:{session}}=await db.auth.getSession();
  if(session){boot()}else{login()}
}

function login(){
  app.innerHTML=`<div class="login"><div class="card"><img class="logo-l" src="assets/logo.png" alt="Surtify"><p class="mu" style="text-align:center">Caja registradora simple</p>
  <label>Correo<input id="em" type="email" autocomplete="username"></label>
  <label>Contraseña<input id="pw" type="password" autocomplete="current-password"></label>
  <button id="go" style="width:100%">Entrar</button><button class="g s" id="ins" hidden style="width:100%;margin-top:8px">Instalar app en este dispositivo</button></div></div>`;
  const go=async()=>{
    const {error}=await db.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
    if(error){toast('Correo o contraseña incorrectos',true)}else{boot()}};
  $('#go').onclick=go;btnInstalar();
  $('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
}

async function boot(){
  const p=await call('perfil_actual');
  if(!p.data){app.innerHTML='<div class="card"><h2>Usuario sin empleado</h2><p>Tu cuenta no está vinculada a un empleado activo.</p><button class="g" id="lo">Salir</button></div>';$('#lo').onclick=logout;return}
  perfil=p.data;adm=!!perfil.es_administrador;tab=adm?'panel':'vender';await refresh();
}
async function logout(){await db.auth.signOut();cart.clear();devSel=null;repR=null;cartera=[];carteraOk=false;metodoSel='Efectivo';cliSel='';facPer='hoy';facSuc='';facQ='';facMet='';facSin=false;autoSub='verificar';autoCnt=0;sugUrg=0;caja=null;perfil=null;login()}
async function refresh(){
  caja=(await call('resumen_caja')).data;
  if(caja){const {data,error}=await db.from('v_productos_pos').select('*').order('nombre');if(error)toast(error.message,true);prods=data||[]}
  if(adm){const {count}=await db.from('v_inventario_admin').select('id_inventario',{count:'exact',head:true}).eq('en_alerta',true);invAlertas=count||0;
    const [ap,ac]=await Promise.all([db.from('pagos_autoservicio').select('id_pago',{count:'exact',head:true}).eq('verificacion','Por verificar'),
      db.from('clientes_autoservicio').select('id_cliente',{count:'exact',head:true}).eq('estado','Pendiente')]);autoCnt=(ap.count||0)+(ac.count||0);
    const sg=await db.rpc('sugerencias_compra',{p_entrega:sugEnt,p_cobertura:sugCob});sugUrg=sg.error?0:((sg.data&&sg.data.items)||[]).filter(x=>x.urgencia==='Urgente').length}
  render();
}

function head(){
  return `<div class="hd"><img class="logo" src="assets/logo.png" alt="Surtify"><span class="sp"></span><button class="g s" id="ins" hidden>Instalar app</button><button class="g s" id="lo">Salir</button></div>
  <div class="mu who">${esc(perfil.nombre_comercial)} · ${esc(perfil.nombre_sucursal)} · ${esc(perfil.nombre)} · ${adm?'Modo ERP multisede':'Caja simple'}</div>`;
}
function setBadge(){const b=app.querySelector('[data-t="inv"]');if(b)b.innerHTML='Inventario'+(invAlertas?` <span class="badge">${invAlertas}</span>`:'')}
function openCard(){
  return `<div class="card"><h2>Abrir caja</h2><p class="mu">Indica el efectivo con el que inicias el turno (la base para dar cambio).</p>
  <input id="base" type="number" inputmode="decimal" min="0" placeholder="Ej: 50000"><button id="ab" style="width:100%">Abrir caja</button></div>`;
}
function bindOpen(){
  $('#ab').onclick=async()=>{const r=await call('abrir_caja',{p_monto_apertura:Number($('#base').value)});if(r.data){toast('Caja abierta');refresh()}};
}

function render(){
  const h=head();
  if(!adm&&!caja){app.innerHTML=h+openCard();$('#lo').onclick=logout;btnInstalar();bindOpen();return}
  const tabs=adm?[['panel','Panel'],['inv','Inventario'+(invAlertas?` <span class="badge">${invAlertas}</span>`:'')],['compras','Compras'+(sugUrg?` <span class="badge">${sugUrg}</span>`:'')],['vender','Vender'],['facturas','Facturas'],['fiados','Fiados'],['auto','Autoservicio'+(autoCnt?` <span class="badge">${autoCnt}</span>`:'')],['devolver','Devolver'],['gasto','Gasto'],['reporte','Reporte'],['cerrar','Cerrar caja']]
                :[['vender','Vender'],['facturas','Mis ventas'],['fiados','Fiados'],['devolver','Devolver'],['gasto','Gasto'],['reporte','Reporte'],['cerrar','Cerrar caja']];
  const deCaja=['vender','devolver','gasto','cerrar'].includes(tab);
  app.innerHTML=h+(caja&&deCaja?`<div class="stats">
    <div><span class="mu">Efectivo esperado</span><b>${cop(caja.monto_cierre_esperado)}</b></div>
    <div><span class="mu">${caja.num_ventas===1?'Venta':'Ventas'} (${caja.num_ventas})</span><b>${cop(caja.total_ventas)}</b></div>
    <div><span class="mu">Gastos</span><b>${cop(caja.total_gastos)}</b></div></div>`:'')+
    `<div class="tabs">${tabs.map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div><div id="body"></div>`;
  $('#lo').onclick=logout;btnInstalar();
  app.querySelectorAll('[data-t]').forEach(b=>{b.onclick=()=>{tab=b.dataset.t;render()}});
  if(deCaja&&!caja){$('#body').innerHTML=openCard();bindOpen();return}
  ({panel:vPanel,inv:vInv,compras:vCompras,vender:vVender,facturas:vFacturas,fiados:vFiados,auto:vAuto,devolver:vDevolver,gasto:vGasto,reporte:vReporte,cerrar:vCerrar})[tab]();
}

/* ---------- Vender ---------- */
const bajo=p=>p.stock<=(p.stock_minimo??0);
function vVender(){
  const low=prods.filter(bajo);
  $('#body').innerHTML=(low.length?`<div class="card alert"><b>⚠ ${low.length} producto${low.length>1?'s':''} con stock bajo</b>
    <div class="mu">${low.slice(0,6).map(p=>esc(p.nombre)+' ('+p.stock+')').join(' · ')}${low.length>6?' …':''}</div></div>`:'')+
  `<div class="card"><div class="row"><input id="q" placeholder="Buscar o escanear código de barras" value="${esc(q)}" autocomplete="off" style="flex:1;min-width:0"><button class="g" id="cam" title="Escanear con la cámara" aria-label="Escanear con la cámara" style="margin:4px 0 8px">📷 Escanear</button></div><div class="grid" id="pl"></div></div>
  <div class="card"><h2>Carrito</h2><div id="cl"></div></div>`;
  $('#cam').onclick=escanear;
  const input=$('#q');
  input.oninput=()=>{q=input.value;list()};
  input.addEventListener('keydown',e=>{if(e.key!=='Enter')return;
    const hit=prods.find(p=>p.codigo_barras===q.trim())||(filtered().length===1?filtered()[0]:null);
    if(hit){add(hit);q='';input.value='';list()}});
  list();cartView();
}
const filtered=()=>{const t=q.trim().toLowerCase();return prods.filter(p=>!t||p.nombre.toLowerCase().includes(t)||(p.codigo_barras||'').includes(t))};
function list(){
  $('#pl').innerHTML=filtered().slice(0,40).map(p=>`<button class="p" data-id="${p.id_producto}" ${p.stock<=0?'disabled':''}>${esc(p.nombre)}<small>${cop(p.precio_venta)} · ${p.stock<=0?'<b class="er">agotado</b>':'stock '+p.stock+(bajo(p)?' · <b class="wa">bajo</b>':'')}</small></button>`).join('')||'<span class="mu">Sin resultados</span>';
  $('#pl').querySelectorAll('.p').forEach(b=>{b.onclick=()=>add(prods.find(p=>p.id_producto==b.dataset.id))});
}
function add(p){const x=cart.get(p.id_producto)||{p,qty:0};if(x.qty>=p.stock){toast('No hay más stock de '+p.nombre,true);return}x.qty++;cart.set(p.id_producto,x);cartView()}
const total=()=>[...cart.values()].reduce((s,x)=>s+x.qty*x.p.precio_venta,0);
function cartView(){
  const el=$('#cl');if(!el)return;
  if(!cart.size){el.innerHTML='<span class="mu">Toca un producto para agregarlo.</span>';return}
  el.innerHTML=[...cart.values()].map(x=>`<div class="line"><div class="sp">${esc(x.p.nombre)}<div class="mu">${cop(x.p.precio_venta)}</div></div>
    <button class="g s" data-m="${x.p.id_producto}">−</button><b>${x.qty}</b><button class="g s" data-a="${x.p.id_producto}">+</button><b style="min-width:80px;text-align:right">${cop(x.qty*x.p.precio_venta)}</b></div>`).join('')+
  `<div class="row" style="margin-top:10px"><span class="sp mu">Total</span><span class="tot">${cop(total())}</span></div>
   <select id="mp"><option>Efectivo</option><option>Nequi</option><option>Daviplata</option><option>Bre-B</option><option>Tarjeta</option><option>Fiado</option></select>
   <div id="fcli" style="display:none"><div class="row"><select id="fc" class="sp"></select><button class="g s" id="fn">+ Nuevo</button></div><div id="fdeb" class="mu"></div></div>
   <div id="efe"><input id="rec" type="number" inputmode="decimal" placeholder="Efectivo recibido"><div id="cam" class="mu"></div></div>
   <div class="row"><button class="g" id="vac">Vaciar</button><button class="sp" id="cob">Cobrar</button></div>`;
  el.querySelectorAll('[data-m]').forEach(b=>{b.onclick=()=>{const x=cart.get(+b.dataset.m);x.qty--;if(x.qty<=0)cart.delete(+b.dataset.m);cartView()}});
  el.querySelectorAll('[data-a]').forEach(b=>{b.onclick=()=>add(cart.get(+b.dataset.a).p)});
  const fillCli=()=>{const sel=$('#fc');sel.innerHTML='<option value="">Elige el cliente</option>'+cartera.map(c=>`<option value="${c.id_cliente}">${esc(c.nombre)}${Number(c.saldo)>0?' · debe '+cop(c.saldo):''}</option>`).join('');sel.value=cliSel;
    const c=cartera.find(x=>String(x.id_cliente)===String(cliSel));$('#fdeb').textContent=c?(c.cupo_fiado!=null?'Cupo '+cop(c.cupo_fiado)+' · ':'')+'debe '+cop(c.saldo):''};
  const sync=()=>{metodoSel=$('#mp').value;$('#efe').style.display=metodoSel==='Efectivo'?'block':'none';$('#fcli').style.display=metodoSel==='Fiado'?'block':'none';
    if(metodoSel==='Fiado'){if(!carteraOk){loadCartera().then(()=>{if(metodoSel==='Fiado')fillCli()})}else fillCli()}const r=Number($('#rec').value);
    $('#cam').innerHTML=r?(r>=total()?'Cambio: <b class="ok">'+cop(r-total())+'</b>':'<span class="er">Falta '+cop(total()-r)+'</span>'):''};
  $('#mp').value=metodoSel;$('#mp').onchange=sync;$('#rec').oninput=sync;$('#fc').onchange=e=>{cliSel=e.target.value;fillCli()};
  $('#fn').onclick=()=>nuevoCliente(c=>{cliSel=String(c.id_cliente);loadCartera().then(()=>cartView())});sync();
  $('#vac').onclick=()=>{cart.clear();cartView()};
  $('#cob').onclick=async e=>{if(busy)return;busy=true;e.target.disabled=true;
    const ef=$('#mp').value==='Efectivo',fi=$('#mp').value==='Fiado';
    if(fi&&!cliSel){toast('Elige el cliente al que le fías',true);busy=false;e.target.disabled=false;return}
    const r=await call('registrar_venta',{p_items:[...cart.values()].map(x=>({id_producto:x.p.id_producto,cantidad:x.qty})),
      p_metodo_pago:$('#mp').value,p_monto_recibido:ef&&$('#rec').value?Number($('#rec').value):null,p_id_cliente:fi?Number(cliSel):null});
    busy=false;e.target.disabled=false;
    if(r.data){const cn=fi?(cartera.find(x=>String(x.id_cliente)===String(cliSel))||{}).nombre:null;cart.clear();q='';metodoSel='Efectivo';cliSel='';carteraOk=false;await refresh();recibo(r.data,cn)}};
}

/* ---------- Comprobantes de pago (foto del pantallazo/recibo como soporte) ---------- */
const digital=m=>!!m&&m!=='Efectivo'&&m!=='Fiado';
async function comprimir(file){ // reduce la foto del celular (varios MB) a ~200 KB sin perder legibilidad
  const MAX=1280;
  try{
    const bmp=await createImageBitmap(file);
    const k=Math.min(1,MAX/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.72));
    if(b)return b;
  }catch(e){}
  if(file.size<=3*1024*1024&&/^image\/(jpeg|png|webp)$/.test(file.type))return file;
  throw new Error('No se pudo procesar la imagen. Prueba con otra foto.');
}
async function subirComprobante(file,ref){ // ref: {id_factura} o {id_movimiento}
  const blob=await comprimir(file);
  const ruta=`${perfil.id_comercio}/${ref.id_factura?'f'+ref.id_factura:'a'+ref.id_movimiento}-${Date.now()}.${blob.type==='image/png'?'png':blob.type==='image/webp'?'webp':'jpg'}`;
  const up=await db.storage.from('comprobantes').upload(ruta,blob,{contentType:blob.type||'image/jpeg',upsert:false});
  if(up.error){toast('No se pudo subir la foto: '+up.error.message,true);return false}
  const r=await call('adjuntar_comprobante',{p_id_factura:ref.id_factura||null,p_id_movimiento:ref.id_movimiento||null,p_ruta:ruta});
  return !r.error;
}
function botonComprobante(cont,ref,onDone){ // pone en 'cont' el botón "Adjuntar foto del comprobante"
  cont.innerHTML=`<button class="g" data-adj style="width:100%;margin-top:6px">📎 Adjuntar foto del comprobante</button>
    <input type="file" accept="image/*" hidden data-file>`;
  const b=cont.querySelector('[data-adj]'),f=cont.querySelector('[data-file]');
  b.onclick=()=>f.click();
  f.onchange=async()=>{const file=f.files[0];if(!file)return;
    b.disabled=true;b.textContent='Subiendo…';
    let ok=false;try{ok=await subirComprobante(file,ref)}catch(e){toast(e.message,true)}
    f.value='';b.disabled=false;b.textContent='📎 Adjuntar foto del comprobante';
    if(ok){toast('Comprobante guardado');onDone&&onDone()}};
}
async function verComprobantes(ref){

const fechaLarga=x=>new Date(x).toLocaleString('es-CO',{timeZone:'America/Bogota',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
function waFactura(x,f,tel){ // comprobante de venta para enviar al cliente por WhatsApp (sin tel: WhatsApp deja elegir el contacto)
  const L=[`*${perfil.nombre_comercial}*`,`Comprobante de venta ${x.numero_factura}`,fechaLarga(x.fecha_emision)+' · '+f.sucursal,''];
  x.lineas.forEach(l=>L.push(`${l.vendida} × ${l.nombre} — ${cop(l.vendida*l.precio)}`));
  L.push('',`*Total: ${cop(x.total)}* (IVA incluido)`,`Pago: ${x.metodo_pago}`);
  if(Number(f.devuelto)>0)L.push(`Devuelto: ${cop(f.devuelto)}`);
  L.push('','¡Gracias por tu compra!');
  return 'https://wa.me/'+(tel||'')+'?text='+encodeURIComponent(L.join('\n'));
}

  const [d,h]=((per)=>{const keep=repPer;repPer=per;const r=repRango();repPer=keep;return r})(facPer);

  if(!adm)qy=qy.eq('id_empleado',perfil.id_empleado);

  if(facMet)qy=qy.eq('metodo_pago',facMet);
  const {data,error}=await qy;if(error){toast(error.message,true);return}
  const draw=()=>{
    const t=facQ.trim().toLowerCase();
    const L=(data||[]).filter(f=>(!facSin||(digital(f.metodo_pago)&&!f.n_comprobantes&&!f.ref_pasarela))&&(!t||[f.numero_factura,f.cliente,f.cajero].some(x=>String(x||'').toLowerCase().includes(t))));
    const tot=L.reduce((a,f)=>a+Number(f.total_facturado),0),dev=L.reduce((a,f)=>a+Number(f.devuelto),0);
    $('#fb').innerHTML=(L.length?`<div class="line"><span class="sp"><b>${pl(L.length,'factura')}</b><div class="mu">${L.length>=500?'Se muestran las 500 más recientes. ':''}${dev>0?'Devuelto '+cop(dev):'Sin devoluciones'}</div></span><b>${cop(tot-dev)}</b></div>`:'')+
     (L.length?L.map(f=>`<button class="g" data-f="${f.id_factura}" style="width:100%;text-align:left;margin-bottom:6px"><b>${esc(f.numero_factura)}</b> · ${cop(f.total_facturado)} · ${esc(f.metodo_pago)}${f.cliente?' · '+esc(f.cliente):''}<br><span class="mu">${hora(f.fecha_emision)}${adm?' · '+esc(f.sucursal)+' · '+esc(f.cajero||'—'):''} · ${f.unidades} ${Number(f.unidades)===1?'unidad':'unidades'}${Number(f.devuelto)>0?' · devuelto '+cop(f.devuelto):''}${f.n_comprobantes>0?' · 📎 '+f.n_comprobantes:f.ref_pasarela?(f.verificacion==='Por verificar'?' · <b class="wa">⏳ por verificar</b>':f.verificacion==='Dudoso'?' · <b class="er">❗ dudoso</b>':f.verificacion==='Verificado'?' · ✅ verificado':' · 🔗 '+esc(f.ref_pasarela)):digital(f.metodo_pago)?' · <b class="wa">⚠ sin comprobante</b>':''}</span></button>`).join(''):'<span class="mu">No hay facturas en este periodo.</span>');
    $('#fb').querySelectorAll('[data-f]').forEach(b=>b.onclick=async()=>{
      const f=L.find(x=>String(x.id_factura)===b.dataset.f);const r=await call('devolucion_disponible',{p_id_factura:f.id_factura});if(!r.data)return;
      const x=r.data;const m=modal(`<h2>${esc(x.numero_factura)}</h2><p class="mu">${hora(x.fecha_emision)} · ${esc(x.metodo_pago)}${f.cliente?' · '+esc(f.cliente):''}${adm?' · '+esc(f.sucursal)+' · '+esc(f.cajero||'—'):''}</p>`+
       x.lineas.map(l=>`<div class="line"><span class="sp">${esc(l.nombre)}<div class="mu">${l.vendida} × ${cop(l.precio)}${l.devuelta?' · devueltas '+l.devuelta:''}</div></span>${cop(l.vendida*l.precio)}</div>`).join('')+
       `<div class="line"><span class="sp"><b>Total</b></span><b>${cop(x.total)}</b></div>${Number(f.devuelto)>0?`<div class="line"><span class="sp">Devuelto</span>${cop(f.devuelto)}</div>`:''}
        ${f.ref_pasarela?`<div class="line"><span class="sp">${f.verificacion&&f.verificacion!=='No aplica'?'Referencia Bre-B · '+esc(f.verificacion):'Pasarela de pago'}</span><b>${esc(f.ref_pasarela)}</b></div>`:''}${(digital(f.metodo_pago)&&!f.ref_pasarela)||f.n_comprobantes>0?`<div class="line"><span class="sp">Comprobantes</span><b>${f.n_comprobantes>0?'📎 '+f.n_comprobantes:'<span class="wa">⚠ ninguno</span>'}</b></div>${f.n_comprobantes>0?'<button class="g" id="fv" style="width:100%;margin-top:6px">Ver comprobantes</button>':''}<div id="adj"></div>`:''}
        <input id="ft" type="tel" inputmode="tel" placeholder="WhatsApp del cliente (opcional)" style="margin-top:10px">
        <button id="fw" style="width:100%">Enviar por WhatsApp</button>
        <button class="g" id="fx" style="width:100%;margin-top:6px">Cerrar</button>`);
      m.querySelector('#fx').onclick=()=>m.remove();
      const fv=m.querySelector('#fv');if(fv)fv.onclick=()=>verComprobantes({id_factura:f.id_factura});
      const aj=m.querySelector('#adj');if(aj&&digital(f.metodo_pago)&&!f.ref_pasarela)botonComprobante(aj,{id_factura:f.id_factura},()=>{m.remove();vFacturas()});

        window.open(waFactura(x,f,t),'_blank','noopener')}});
  };
  draw();
  $('#fq').oninput=e=>{facQ=e.target.value;draw()};
}

let repR=null,repPer='hoy',repSuc='';
let facPer='hoy',facSuc='',facQ='',facMet='';
let sugUrg=0,sugEnt=3,sugCob=14,sugSuc='';
function bogota(d){return new Date(d.getTime()-5*3600e3).toISOString().slice(0,10)}
function repRango(){
  const hoy=new Date(),h=bogota(hoy);
  if(repPer==='hoy')return [h,h];
  if(repPer==='ayer'){const y=bogota(new Date(hoy.getTime()-864e5));return [y,y]}
  if(repPer==='mes')return [h.slice(0,8)+'01',h];
  const [a,m]=h.split('-').map(Number),p=new Date(Date.UTC(a,m-2,1)),f=new Date(Date.UTC(a,m-1,0));
  return [p.toISOString().slice(0,10),f.toISOString().slice(0,10)];
}
function repTexto(r){
  const L=[],f=r.facturas;
  L.push(`*Resumen de ventas – ${r.comercio.nombre}*`);
  if(r.comercio.nit)L.push(`NIT ${r.comercio.nit}`);
  L.push(`Periodo: ${r.desde}${r.desde===r.hasta?'':' a '+r.hasta}${r.sucursal?' · '+r.sucursal:' · Todas las sedes'}`,'');
  L.push(`Facturas: ${f.num}${f.primera?` (${f.primera} a ${f.ultima})`:''}`,`Base gravable: ${cop(f.subtotal)}`,`IVA: ${cop(f.iva)}`,`Total facturado: ${cop(f.total)}`);
  (r.iva_por_tarifa||[]).forEach(t=>L.push(`  · IVA ${Number(t.tarifa)}%: base ${cop(t.base)} / IVA ${cop(t.iva)}`));
  L.push(`Devoluciones (${r.devoluciones.num}): -${cop(r.devoluciones.total)}`,`*Ventas netas: ${cop(r.ventas_netas)}*`,'');
  Object.entries(r.por_metodo||{}).forEach(([k,v])=>L.push(`${k}: ${cop(v)}`));
  L.push(`Gastos de caja: ${cop(r.gastos)}`);
  if(Number(r.abonos_cartera)>0)L.push(`Abonos de fiados recibidos: ${cop(r.abonos_cartera)}`);
  if(Number(r.por_cobrar)>0)L.push(`Por cobrar a clientes (fiados): ${cop(r.por_cobrar)}`);
  if((r.por_sucursal||[]).length>1){L.push('');r.por_sucursal.forEach(s=>L.push(`${s.nombre}: ${cop(s.total)} (${pl(s.num,'factura')})`))}
  L.push('','_Generado con Surtify_');return L.join('\n');
}
function repCSV(r){
  const c=v=>'"'+String(v??'').replace(/"/g,'""')+'"',rows=[['Tipo','Número','Fecha','Sucursal','Factura','Método/Motivo','Subtotal','IVA','Total','Estado DIAN']];
  r.detalle_facturas.forEach(x=>rows.push(['Factura',x.numero,x.fecha,x.sucursal,'',x.metodo,x.subtotal,x.iva,x.total,x.estado_dian]));
  r.detalle_notas.forEach(x=>rows.push(['Nota crédito',x.numero,x.fecha,x.sucursal,x.factura,x.motivo,'','',-x.total,'']));
  return '﻿'+rows.map(a=>a.map(c).join(';')).join('\r\n');
}

/* ---------- Carga masiva de productos (Excel / CSV) ---------- */
const XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
let xlsxP=null;
const cargarXLSX=()=>window.XLSX?Promise.resolve():(xlsxP||(xlsxP=new Promise((ok,no)=>{const s=document.createElement('script');s.src=XLSX_URL;s.onload=ok;s.onerror=()=>{xlsxP=null;no(new Error('No se pudo cargar el lector de Excel (¿sin internet?)'))};document.head.appendChild(s)})));
const normH=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const IMP_COLS={nombre:['nombre','producto','descripcion','articulo'],precio:['precio','precio venta','precio de venta','valor','pvp'],iva:['iva','impuesto'],
  codigo_barras:['codigo','codigo barras','codigo de barras','ean','barras','cod barras'],categoria:['categoria','linea','grupo'],
  stock:['stock','stock inicial','cantidad','existencias','inventario','unidades'],stock_minimo:['stock minimo','minimo','stock min']};
function impNum(v){ // "$ 12.500" -> 12500 ; "4,5" -> 4.5 ; deja pasar lo que no entienda para que el servidor lo marque
  if(typeof v==='number')return v;let t=String(v??'').trim();if(!t)return '';t=t.replace(/[$\s%]/g,'');
  if(t.includes('.')&&t.includes(','))t=t.replace(/\./g,'').replace(',','.');
  else if(t.includes(','))t=/,\d{1,2}$/.test(t)?t.replace(',','.'):t.replace(/,/g,'');
  else if(/^\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');
  return /^-?\d+(\.\d+)?$/.test(t)?Number(t):String(v).trim();
}
function leerFilas(wb){
  const ws=wb.Sheets[wb.SheetNames[0]];
  const A=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
  if(!A.length)throw new Error('El archivo está vacío');
  const H=A[0].map(normH),idx={};
  for(const k in IMP_COLS){const i=H.findIndex(h=>IMP_COLS[k].some(a=>h===a||h.startsWith(a+' ')));if(i>=0)idx[k]=i}
  if(idx.nombre==null||idx.precio==null)throw new Error('No encuentro las columnas "Nombre" y "Precio" en la primera fila. Usa la plantilla.');
  const filas=[],orig=[],cient=[];
  A.slice(1).forEach((r,j)=>{
    if(r.every(c=>String(c).trim()===''))return;
    const o={nombre:String(r[idx.nombre]??'').trim(),precio:impNum(r[idx.precio])};
    if(idx.iva!=null){let v=impNum(r[idx.iva]);if(typeof v==='number'&&v>0&&v<1)v=Math.round(v*100);o.iva=v}
    if(idx.codigo_barras!=null){const c=String(r[idx.codigo_barras]??'').trim();if(/^\d(\.\d+)?e\+?\d+$/i.test(c))cient.push(j+2);o.codigo_barras=c}
    if(idx.categoria!=null)o.categoria=String(r[idx.categoria]??'').trim();
    if(idx.stock!=null)o.stock=impNum(r[idx.stock]);
    if(idx.stock_minimo!=null)o.stock_minimo=impNum(r[idx.stock_minimo]);
    filas.push(o);orig.push(j+2)});
  if(!filas.length)throw new Error('No encontré productos debajo de la primera fila');
  if(filas.length>2000)throw new Error('Máximo 2000 productos por carga ('+filas.length+' en el archivo). Divide el archivo.');
  return {filas,orig,cient};
}
async function plantillaProductos(){
  try{await cargarXLSX()}catch(e){toast(e.message,true);return}
  const t=(a)=>a.map(r=>r.map(String));
  const ws=XLSX.utils.aoa_to_sheet(t([['Nombre','Precio de venta (IVA incluido)','IVA %','Código de barras','Categoría','Stock inicial','Stock mínimo'],
    ['Arroz Diana x 500g','3200','0','7701234567890','Granos','40','10'],['Gaseosa Colombiana 1.5L','5500','19','7709876543210','Bebidas','24','6'],['Pan tajado','6800','0','','Panadería','12','4']]));
  ws['!cols']=[{wch:32},{wch:30},{wch:8},{wch:20},{wch:16},{wch:14},{wch:14}];
  const ins=XLSX.utils.aoa_to_sheet(t([['Cómo llenar la plantilla'],[''],
    ['1. Una fila por producto. Obligatorios: Nombre y Precio.'],['2. Precio: el que paga el cliente (IVA incluido), sin símbolos. Ej: 3200'],
    ['3. IVA %: 19, 5 o 0. Si lo dejas vacío se toma 0.'],['4. Código de barras: opcional, pero con él puedes escanear. Formatea esa columna como TEXTO para no perder ceros ni que Excel lo vuelva 7,7E+12.'],

  <div class="card ${(p.alertas_stock||[]).length?'alert':''}"><h2>Alertas de stock mínimo</h2>${(p.alertas_stock||[]).length?`<div class="t"><table><tr><th>Producto</th><th>Sede</th><th class="n">Stock</th><th class="n">Mín.</th></tr>${p.alertas_stock.map(a=>`<tr><td>${esc(a.producto)}</td><td>${esc(a.sucursal)}</td><td class="n"><b class="er">${a.stock}</b></td><td class="n">${a.stock_minimo}</td></tr>`).join('')}</table></div>`:'<span class="ok">Todo el inventario está sobre el mínimo.</span>'}</div>
  <div class="card t"><h2>Turnos de caja recientes</h2>${(p.turnos_recientes||[]).length?`<table><tr><th>Sede</th><th>Cajero</th><th>Apertura</th><th>Estado</th><th class="n">Esperado</th><th class="n">Contado</th><th class="n">Diferencia</th></tr>${p.turnos_recientes.map(x=>`<tr><td>${esc(x.sucursal)}</td><td>${esc(x.empleado)}</td><td>${hora(x.apertura)}</td><td>${x.estado==='Abierta'?'<span class="ok">Abierta</span>':'Cerrada'}</td><td class="n">${cop(x.esperado)}</td><td class="n">${x.contado==null?'—':cop(x.contado)}</td><td class="n ${x.diferencia==null?'':x.diferencia===0?'ok':x.diferencia<0?'er':'wa'}">${x.diferencia==null?'—':x.diferencia===0?'Cuadra':cop(x.diferencia)}</td></tr>`).join('')}</table>`:'<span class="mu">Aún no hay turnos.</span>'}</div>`;
  app.querySelectorAll('[data-d]').forEach(b=>{b.onclick=()=>{dias=+b.dataset.d;vPanel()}});
  $('#rf').onclick=()=>{vPanel()};
  if($('#gc'))$('#gc').onclick=()=>{tab='compras';render()};
  app.querySelectorAll('[data-al]').forEach(b=>{b.onclick=()=>{invSuc=b.dataset.al;invSolo=true;invQ='';tab='inv';render()}});
}

/* ---------- Escáner de códigos de barras con la cámara ---------- */
const ZXING_URL='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
let zxingP=null;
const cargarZXing=()=>window.ZXing?Promise.resolve():(zxingP||(zxingP=new Promise((ok,no)=>{const s=document.createElement('script');s.src=ZXING_URL;s.onload=ok;s.onerror=()=>{zxingP=null;no(new Error('No se pudo cargar el lector (¿sin internet?)'))};document.head.appendChild(s)})));
function pitido(){try{const A=window.AudioContext||window.webkitAudioContext,c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},110)}catch(e){}try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
/* Abre un modal con la cámara. alLeer(codigo, cerrar) se llama una vez por lectura (el mismo código frente a la cámara no se repite).
   opts: titulo, ayuda, extra (HTML bajo el video), botones (HTML; por defecto "Listo"), alCerrar. Devuelve {m,cerrar} o null. */
async function camara(o){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Este navegador no permite usar la cámara. Escribe el código a mano.',true);return null}
  const m=modal(`<h2>${o.titulo||'Escanear código de barras'}</h2><p class="mu">${o.ayuda||'Apunta la cámara al código de barras o QR del producto.'}</p>
    <video id="sv" playsinline muted autoplay style="width:100%;max-height:${o.extra?'32vh':'50vh'};border-radius:10px;background:#000;object-fit:cover"></video>
    ${o.extra||''}${o.botones||'<button id="sx" style="width:100%;margin-top:8px">Listo</button>'}`);
  const v=m.querySelector('#sv');let stop=false,stream=null,reader=null,ultimo='',tUlt=0;
  const cerrar=()=>{if(stop)return;stop=true;try{reader&&reader.reset()}catch(e){}try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}m.remove();o.alCerrar&&o.alCerrar()};
  const sx=m.querySelector('#sx');if(sx)sx.onclick=cerrar;
  m.addEventListener('mousedown',e=>{if(e.target===m&&!o.noFuera)cerrar()});
  const alLeer=cod=>{
    cod=String(cod||'').trim();if(!cod||stop)return;
    const t=Date.now();if(cod===ultimo&&t-tUlt<1200){tUlt=t;return} // mismo código aún frente a la cámara: no repetir
    ultimo=cod;tUlt=t;
    if(o.alLeer(cod,cerrar)===true)cerrar();
  };
  const fallo=e=>{cerrar();toast(e&&e.name==='NotAllowedError'?'Permiso de cámara denegado. Actívalo en el navegador o escribe el código.':(e&&e.message)||'No se pudo abrir la cámara',true)};
  (async()=>{try{
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
      if(stop){stream.getTracks().forEach(t=>t.stop());return}
      v.srcObject=stream;await v.play().catch(()=>{});
      const ciclo=async()=>{if(stop)return;try{if(v.readyState>=2){const r=await det.detect(v);if(r&&r[0])alLeer(r[0].rawValue)}}catch(e){}setTimeout(ciclo,200)};ciclo();
    }else{
      await cargarZXing();if(stop)return;
      const Z=window.ZXing,h=new Map();h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.QR_CODE]);
      reader=new Z.BrowserMultiFormatReader(h,150);
      await reader.decodeFromConstraints({video:{facingMode:{ideal:'environment'}},audio:false},v,r=>{if(r)alLeer(r.getText())});
    }
  }catch(e){fallo(e)}})();
  return {m,cerrar};
}
/* Vender: cada lectura suma 1 unidad al carrito */
function escanear(){
  const unid=()=>[...cart.values()].reduce((a,x)=>a+x.qty,0);
  camara({titulo:'Escanear código de barras',ayuda:'Apunta la cámara al código de barras o QR del producto. Puedes escanear varios seguidos.',
    extra:`<div class="line" style="margin-top:8px"><span class="sp mu">Carrito: <b id="sn">${unid()}</b> unidades</span></div>`,
    alLeer:async cod=>{
      let p=prods.find(x=>x.codigo_barras===cod);
      if(!p){ // puede ser un producto creado después de abrir la sesión: recargar el catálogo y reintentar
        const {data}=await db.from('v_productos_pos').select('*').order('nombre');if(data){prods=data;p=prods.find(x=>x.codigo_barras===cod)}}
      if(!p){toast('Código '+cod+' no registrado',true);return}
      if(p.stock<=0){toast(p.nombre+': agotado',true);return}
      add(p);pitido();toast('✓ '+p.nombre);const n=document.getElementById('sn');if(n)n.textContent=unid();
    }});
}
/* Inventario: recibir mercancía (cada lectura suma 1 unidad al lote; se registra todo junto) */
function recibirMercancia(){
  const lote=new Map(),nom=id=>(invData.find(r=>r.id_producto===id)||{}).producto||('Producto '+id);
  let sede=invSuc||String(perfil.id_sucursal);
  const pintar=()=>{const el=document.getElementById('rl');if(!el)return;
    el.innerHTML=lote.size?[...lote].map(([id,n])=>`<div class="line"><span class="sp">${esc(nom(id))}</span><input type="number" min="0" inputmode="numeric" value="${n}" data-r="${id}" style="width:74px;margin:0"></div>`).join(''):'<span class="mu">Aún no has escaneado productos.</span>';
    el.querySelectorAll('[data-r]').forEach(i=>i.oninput=()=>{lote.set(Number(i.dataset.r),Math.max(0,Math.floor(Number(i.value)||0)))})};
  camara({titulo:'Recibir mercancía',ayuda:'Escanea cada producto que llega: suma 1 unidad por lectura. Puedes corregir las cantidades abajo.',noFuera:true,
    extra:`<select id="rsd" style="margin-top:8px">${sucs.map(x=>`<option value="${x.id_sucursal}" ${String(x.id_sucursal)===sede?'selected':''}>Entra a: ${esc(x.nombre_sucursal)}</option>`).join('')}</select><div id="rl" style="max-height:24vh;overflow:auto"></div>`,
    botones:'<div class="row" style="margin-top:8px"><button class="g sp" id="rc">Cancelar</button><button class="sp" id="rg">Registrar entrada</button></div>',
    alLeer:cod=>{
      const r=invData.find(x=>x.codigo_barras===cod);
      if(!r){toast('Código '+cod+' no registrado. Créalo con + Producto',true);return}
      lote.set(r.id_producto,(lote.get(r.id_producto)||0)+1);pitido();toast('✓ '+r.producto);pintar()}
  }).then(c=>{if(!c)return;const {m,cerrar}=c;pintar();
    m.querySelector('#rsd').onchange=e=>{sede=e.target.value};
    m.querySelector('#rc').onclick=cerrar;
    m.querySelector('#rg').onclick=async()=>{
      const items=[...lote].filter(([,n])=>n>0);if(!items.length){toast('Escanea al menos un producto',true);return}
      let ok=0,mal=0;const res=[];for(const [id,n] of items){const x=await call('ajustar_stock',{p_id_sucursal:Number(sede),p_id_producto:id,p_delta:n});if(x.data){ok++;res.push([id,n,x.data.stock])}else mal++}
      if(ok){cerrar();await tras({data:1});
        const sn=(sucs.find(x=>String(x.id_sucursal)===String(sede))||{}).nombre_sucursal||'';
        const mm=modal(`<h2 class="ok">Entrada registrada</h2><div class="mu">Entró a: ${esc(sn)}</div>${res.map(([id,n,st])=>`<div class="line"><span class="sp">${esc(nom(id))}</span><span>+${n} → <b>${st}</b></span></div>`).join('')}${mal?`<p class="wa">${mal} producto(s) con error</p>`:''}<button style="width:100%;margin-top:10px">Entendido</button>`);
        mm.querySelector('button').onclick=()=>mm.remove()}};
  });
}
/* Escanea un código y lo deja en un campo de texto */
function escanearEn(sel,alTerminar){
  camara({titulo:'Escanear código',ayuda:'Apunta la cámara al código de barras o QR.',alLeer:(cod,cerrar)=>{
    const el=document.querySelector(sel);if(el){el.value=cod;el.dispatchEvent(new Event('input',{bubbles:true}))}
    pitido();toast('Código leído: '+cod);alTerminar&&alTerminar(cod);return true}});
}

/* ---------- App instalable (PWA) ---------- */
let instalar=null;
const esIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
const instalada=()=>(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
function btnInstalar(){
  const b=document.getElementById('ins');if(!b)return;
  if(instalada()||(!instalar&&!esIOS)){b.hidden=true;return}
  b.hidden=false;
  b.onclick=async()=>{
    if(instalar){instalar.prompt();await instalar.userChoice;instalar=null;btnInstalar()}
    else{const m=modal('<h2>Instalar Surtify</h2><p>En iPhone o iPad: toca el botón <b>Compartir</b> de Safari y elige <b>Agregar a inicio</b>.</p><button id="ix" style="width:100%">Entendido</button>');m.querySelector('#ix').onclick=()=>m.remove()}};
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instalar=e;btnInstalar()});
window.addEventListener('appinstalled',()=>{instalar=null;toast('Surtify quedó instalada');btnInstalar()});
function avisoRed(){
  let b=document.getElementById('off');
  if(navigator.onLine){if(b)b.remove();return}
  if(!b){b=document.createElement('div');b.id='off';b.className='off';b.textContent='Sin conexión: puedes ver la app, pero vender y consultar datos necesita internet.';document.body.prepend(b)}
}
window.addEventListener('online',avisoRed);window.addEventListener('offline',avisoRed);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
avisoRed();
init();
